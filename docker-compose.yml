services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: graphflow
      POSTGRES_USER: graphflow
      POSTGRES_PASSWORD: graphflow
    ports:
      - "5432:5432"
    volumes:
      - graphflow-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graphflow -d graphflow"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  graphflow-postgres:
